name: CI

on:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    name: Check, test, build
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check types
        run: npm run check

      - name: Run unit tests
        run: npm run test:unit

      - name: Build
        run: npm run build
